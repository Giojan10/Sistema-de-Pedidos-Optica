<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vista Catálogo - Óptica</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="navbar" id="navbar-container"></div>

    <div class="contenedor">
        <div class="titulo-box">VISTA CATÁLOGO</div>

        <div class="grid-principal sin-lateral-derecho">
            <div class="filtros">
                <label>Ordenar por:</label>
                <select id="f-orden">
                    <option value="precio_desc">Precio (descendente)</option>
                    <option value="precio_asc">Precio (ascendente)</option>
                    <option value="nombre_asc">Nombre (A-Z)</option>
                </select>

                <label>Precio:</label>
                <div class="rango">
                    <input type="number" id="f-desde" placeholder="Desde">
                    <input type="number" id="f-hasta" placeholder="Hasta">
                </div>

                <label>Color:</label>
                <div class="checkbox-linea"><input type="radio" name="f-color" value="Todos" checked> Todos</div>
                <div class="checkbox-linea"><input type="radio" name="f-color" value="Verde"> Verde</div>
                <div class="checkbox-linea"><input type="radio" name="f-color" value="Rojo"> Rojo</div>
                <div class="checkbox-linea"><input type="radio" name="f-color" value="Azul"> Azul</div>

                <button class="btn btn-block" id="btn-filtrar">Aplicar Filtros</button>
            </div>

            <div>
                <div class="buscar-bar">
                    <input type="text" id="f-buscar" placeholder="Buscar producto...">
                    <button class="btn" id="btn-buscar">BUSCAR</button>
                </div>

                <div id="productos-grid" class="productos-grid"></div>
                <p id="mensaje-vacio" class="mensaje-vacio" style="display:none;">No se encontraron productos con esos filtros.</p>
            </div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/catalogo.js"></script>
</body>
</html>
