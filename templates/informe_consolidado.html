<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Informe Consolidado - Óptica</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
    <div class="navbar" id="navbar-container"></div>

    <div class="contenedor">
        <div class="titulo-box">INFORME CONSOLIDADO Y TABULAR</div>

        <div class="filtros" style="display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap;">
            <div>
                <label>Fecha de inicio:</label>
                <input type="date" id="f-inicio">
            </div>
            <div>
                <label>Fecha final:</label>
                <input type="date" id="f-final">
            </div>
            <div style="flex:1; min-width:180px;">
                <label>Cliente:</label>
                <select id="f-cliente"><option value="">Todos</option></select>
            </div>
            <button class="btn" id="btn-filtrar">Aplicar</button>
            <button class="btn btn-secundario" id="btn-exportar">Exportar</button>
        </div>

        <div class="grid-principal" style="grid-template-columns: 1fr 1fr; margin-top:20px;">
            <div>
                <h3>Informe consolidado: rendimiento ventas por color</h3>
                <table class="informe">
                    <thead>
                        <tr>
                            <th>Color Producto</th><th>Total Productos Vendidos</th>
                            <th>Promedio de Precio</th><th>Ingresos Totales</th><th>Productos en Inventario</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body"></tbody>
                </table>
                <p id="mensaje-vacio" class="mensaje-vacio" style="display:none;">No hay datos para el periodo seleccionado.</p>
                <p id="cliente-label" style="margin-top:10px; font-weight:600;">Cliente: Todos</p>
            </div>

            <div class="grafico-caja">
                <h3>Informe gráfico: productos vendidos por color</h3>
                <canvas id="grafico-colores" height="220"></canvas>
            </div>
        </div>
    </div>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/informe_consolidado.js"></script>
</body>
</html>
